# Parámetros del pipeline (editado desde el panel de administración).

anios:
  desde: 2001
  hasta: ~
  deis_ultimo_completo: 2024
supresion:
  n_min: 5
edad:
  grupo_abierto: 80
  grupos_app:
  - etiqueta: 0-14
    min: 0
    max: 14
  - etiqueta: 15-29
    min: 15
    max: 29
  - etiqueta: 30-44
    min: 30
    max: 44
  - etiqueta: 45-64
    min: 45
    max: 64
  - etiqueta: 65+
    min: 65
    max: 150
tasas:
  por: 100000
  por_nacidos_vivos: 1000
  por_universo: 1000
  poblacion_estandar: poblacion_estandar_oms
  calibrar_edad0_a_nacidos_vivos: yes
  ajuste_edad_fuentes: grd
  por_egresos: 100000
  estandar_chile_anios:
  - 2002
  - 2025
clasificacion:
  mecanismo:
    egresos_deis:
      columna: mecanismo_6grupos
      solo_etiologicos: no
      sin_dato: No especificada/otras
    grd:
      columna: mecanismo
      solo_etiologicos: yes
      sin_dato: Desconocido/otro
geografia:
  region_respaldo_ambigua:
  - regiones:
    - 1
    - 10
    hasta_anio: 2007
  - regiones: 8
    hasta_anio: 2018
estada:
  max_valida: 365
severidad:
  tabla: icdpic_i10base_map_roc.csv
  metodo: NIS
  sha256: ~
costos:
  estructura_precios_grd: 2024
  referencia_precios: 2025-10
  ipc_desde: '2018-01-01'
  codigo_mai_dia_cama: ~
  incluir_costos_indirectos: no
  edad_laboral_min: 15
  edad_retiro:
    Hombre: 65
    Mujer: 60
salida:
  formato: csv
publicacion:
  titulo: 'Observatorio CMF Chile: plataforma abierta de epidemiología craneomaxilofacial
    basada en DEIS y GRD'
  autores: Sáenz-Ravello G
  doi: 10.5281/zenodo.24563475
  articulo_referencia: ~
  url_app: https://observatoriomaxilofacial.cl
  repositorio: ~
