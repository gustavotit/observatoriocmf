# Biblioteca de epidemiología CMF de Chile (pestaña "Biblioteca" de la app). Se agrega y quita desde el panel de
# administración (pestaña Biblioteca, con autocompletado por DOI) y basta "Solo redesplegar": no recalcula datos.
#
# Campos:
#   tipo         observatorio (lo reproduce un módulo) | serie_hospitalaria | nacional | revision
#   modulo       ámbito del observatorio (id de config/modules.yml), opcional
#   autores      Vancouver (hasta 6 y "et al"); anio; titulo; revista (abreviatura NLM)
#   referencia   volumen(número):páginas o número de artículo; doi (sin https://doi.org/); pmid
#   estado       publicado | aceptado | en prensa
#   institucion  hospital o centro (series hospitalarias); region; periodo de los datos; casos (n)
#   diseno       diseño y fuente, en una línea; datos: fuente y período que reproduce el módulo
# Un artículo sin doi se muestra sin enlace. Los manuscritos en revisión quedan comentados hasta que se publiquen.

articulos:
  - tipo: observatorio
    modulo: trauma
    autores: "Sáenz-Ravello G, Carrasco García P, Sáenz-Ravello L, Fisher EL"
    anio: 2026
    titulo: "Epidemiology of Craniomaxillofacial Trauma in Chile: A Systematic Review and 24-Year Nationwide Interrupted Time-Series Analysis"
    revista: "Craniomaxillofac Trauma Reconstr"
    referencia: "19(3):32"
    doi: "10.3390/cmtr19030032"
    estado: publicado
    datos: "DEIS 2001-2024"
    region: "Nacional"

